<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DMS - Dorra Document Controller</title>
  
  <!-- PWA Metadata & Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="theme-color" content="#1e40af">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* شاشة التحميل لحين فتح السكربت */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #1e40af;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loader Screen -->
  <div id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 15px; color: #1e40af; font-weight: bold;">جاري تحميل النظام...</p>
  </div>

  <!-- Google Apps Script Embedded Frame -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycby-58vKIygp4zz3ZZiO_-Qzmu6clg8IMgCigTN0p95dLx0vFgJHCEqsmx1d2gdndlbAxg/exec"
    allow="geolocation; microphone; camera"
    onload="hideLoader()">
  </iframe>

  <script>
    // إخفاء شاشة التحميل عند اكتمال تحميل الـ iframe
    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 400);
    }

    // تسجيل الـ Service Worker لتمكين الـ PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker Registered successfully.'))
          .catch(err => console.error('Service Worker Registration failed:', err));
      });
    }
  </script>
</body>
</html>
